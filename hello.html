<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Grid — Sacred Numerology</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --gold: #C9A84C;
            --gold-light: #E8CC7A;
            --gold-dim: #8B6E2E;
            --ink: #0D0A07;
            --parchment: #F5EDD6;
            --parchment-dark: #E8D9B5;
            --crimson: #8B1A1A;
            --teal: #1A5C5C;
            --violet: #4A1A6B;
            --surface: #1A1410;
            --surface-2: #241E17;
            --surface-3: #2E2720;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--ink);
            font-family: 'Crimson Pro', Georgia, serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201, 168, 76, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(74, 26, 107, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 40% 30% at 10% 70%, rgba(26, 92, 92, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Noise texture overlay */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        #root {
            position: relative;
            z-index: 1;
        }

        .cinzel {
            font-family: 'Cinzel', serif;
        }

        .crimson {
            font-family: 'Crimson Pro', serif;
        }

        /* Mandala background */
        .mandala-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 700px;
            height: 700px;
            opacity: 0.04;
            pointer-events: none;
            animation: slowSpin 120s linear infinite;
        }

        @keyframes slowSpin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes pulse-ring {
            0% {
                box-shadow: 0 0 0 0 rgba(201, 168, 76, 0.4);
            }

            100% {
                box-shadow: 0 0 0 12px rgba(201, 168, 76, 0);
            }
        }

        @keyframes gridReveal {
            from {
                opacity: 0;
                transform: scale(0.95) rotate(-1deg);
            }

            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .fade-in-up {
            animation: fadeInUp 0.5s ease forwards;
        }

        .gold-border {
            border: 1px solid rgba(201, 168, 76, 0.3);
        }

        .gold-border-bright {
            border: 1px solid rgba(201, 168, 76, 0.7);
        }

        .glass {
            background: rgba(26, 20, 16, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .login-card {
            background: linear-gradient(135deg, #1A1410 0%, #241E17 50%, #1A1410 100%);
            border: 1px solid rgba(201, 168, 76, 0.4);
            box-shadow:
                0 0 60px rgba(201, 168, 76, 0.08),
                0 0 120px rgba(201, 168, 76, 0.04),
                inset 0 1px 0 rgba(201, 168, 76, 0.15);
        }

        .gold-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(201, 168, 76, 0.25);
            color: var(--parchment);
            font-family: 'Crimson Pro', serif;
            font-size: 16px;
            letter-spacing: 0.02em;
            transition: all 0.3s ease;
            outline: none;
        }

        .gold-input::placeholder {
            color: rgba(201, 168, 76, 0.35);
            font-style: italic;
        }

        .gold-input:focus {
            border-color: rgba(201, 168, 76, 0.7);
            background: rgba(255, 255, 255, 0.07);
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.1), inset 0 0 10px rgba(201, 168, 76, 0.03);
        }

        .btn-primary {
            background: linear-gradient(135deg, #8B6E2E 0%, #C9A84C 40%, #E8CC7A 60%, #C9A84C 100%);
            color: var(--ink);
            font-family: 'Cinzel', serif;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-size: 12px;
            border: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 60%;
            height: 200%;
            background: rgba(255, 255, 255, 0.2);
            transform: skewX(-20deg);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::after {
            left: 120%;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 30px rgba(201, 168, 76, 0.5);
            transform: translateY(-1px);
        }

        /* The 3x3 Grid */
        .vedic-grid-container {
            background: linear-gradient(135deg, #1A1410 0%, #0D0A07 100%);
            border: 2px solid rgba(201, 168, 76, 0.5);
            box-shadow:
                0 0 40px rgba(201, 168, 76, 0.12),
                inset 0 0 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .vedic-grid-container::before {
            content: '';
            position: absolute;
            inset: 4px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            pointer-events: none;
        }

        .grid-cell {
            background: rgba(26, 20, 16, 0.8);
            border: 1px solid rgba(201, 168, 76, 0.18);
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .grid-cell:hover {
            background: rgba(201, 168, 76, 0.06);
        }

        .grid-cell-num {
            position: absolute;
            top: 3px;
            right: 4px;
            font-family: 'Cinzel', serif;
            font-size: 8px;
            color: rgba(201, 168, 76, 0.2);
            font-weight: 600;
        }

        .cell-content {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 1px;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 14px;
            line-height: 1;

        /* Dasha colors */
        .md-color {
            color: #E85555;
        }

        .ad-color {
            color: #55C98A;
        }

        .pd-color {
            color: #5594E8;
        }

        .dd-color {
            color: #E8A855;
        }

        .destiny-color {
            color: #B855E8;
        }

        .base-color {
            color: rgba(201, 168, 76, 0.85);
        }

        /* Nav arrows */
        .nav-btn {
            background: linear-gradient(135deg, #241E17, #1A1410);
            border: 1px solid rgba(201, 168, 76, 0.35);
            color: var(--gold);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            width: 44px;
            height: 44px;
            border-radius: 50%;

        .nav-btn:hover {
            background: rgba(201, 168, 76, 0.12);
            border-color: rgba(201, 168, 76, 0.7);
            box-shadow: 0 0 15px rgba(201, 168, 76, 0.2);
        }

        /* Info chips */
        .info-panel {
            background: linear-gradient(135deg, rgba(26, 20, 16, 0.95), rgba(36, 30, 23, 0.95));
            border: 1px solid rgba(201, 168, 76, 0.25);
        }

        .info-chip {
            text-align: center;
            padding: 6px 10px;
        }

        .info-label {
            font-family: 'Cinzel', serif;
            font-size: 7px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(201, 168, 76, 0.5);
            display: block;
        }

        .info-value {
            font-family: 'Cinzel', serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        /* AD List */
        .ad-list-header {
            background: linear-gradient(90deg, rgba(201, 168, 76, 0.08), transparent);
            border-bottom: 1px solid rgba(201, 168, 76, 0.2);
        }

        .ad-row {
            border-bottom: 1px solid rgba(201, 168, 76, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 10px 14px;
        }

        .ad-row:hover {
            background: rgba(201, 168, 76, 0.05);
        }

        .ad-row.active {
            background: linear-gradient(90deg, rgba(85, 201, 138, 0.1), transparent);
            border-left: 3px solid #55C98A;
        }

        .ad-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-weight: 700;
        }

        /* PD rows */
        .pd-row {
            border-bottom: 1px solid rgba(85, 148, 232, 0.12);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 8px 14px;
        }

        .pd-row:hover {
            background: rgba(85, 148, 232, 0.06);
        }

        .pd-row.active {
            background: linear-gradient(90deg, rgba(85, 148, 232, 0.12), transparent);
            border-left: 3px solid #5594E8;
        }

        /* DD rows */
        .dd-row {
            border-bottom: 1px solid rgba(232, 168, 85, 0.1);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 8px 14px;
        }

        .dd-row:hover {
            background: rgba(232, 168, 85, 0.06);
        }

        .dd-row.active {
            background: rgba(232, 168, 85, 0.12);
        }

        .dd-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #C9A84C, #8B6E2E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 700;
            color: var(--ink);
        }

        /* Section cards */
        .section-card {
            background: rgba(26, 20, 16, 0.9);
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        .section-header {
            padding: 8px 14px;
            font-family: 'Cinzel', serif;
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        /* Toggle buttons */
        .toggle-btn {
            border-radius: 6px;
            padding: 10px 16px;
            font-family: 'Cinzel', serif;
            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .toggle-btn-pd {
            background: rgba(85, 148, 232, 0.08);
            border: 1px solid rgba(85, 148, 232, 0.3);
            color: #7EB3F0;
        }

        .toggle-btn-pd:hover,
        .toggle-btn-pd.active {
            background: rgba(85, 148, 232, 0.15);
            border-color: rgba(85, 148, 232, 0.6);
            box-shadow: 0 0 15px rgba(85, 148, 232, 0.15);
        }

        .toggle-btn-dd {
            background: rgba(232, 168, 85, 0.08);
            border: 1px solid rgba(232, 168, 85, 0.3);
            color: #E8A855;
        }

        .toggle-btn-dd:hover {
            background: rgba(232, 168, 85, 0.15);
            border-color: rgba(232, 168, 85, 0.6);
        }

        .toggle-btn-close {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
        }

        .toggle-btn-close:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .lucky-strip {
            background: linear-gradient(90deg, transparent, rgba(201, 168, 76, 0.05), transparent);
            border-top: 1px solid rgba(201, 168, 76, 0.1);
            border-bottom: 1px solid rgba(201, 168, 76, 0.1);
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(201, 168, 76, 0.3);
            border-radius: 2px;
        }

        .grid-reveal {
            animation: gridReveal 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Form input */
        .date-input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(201, 168, 76, 0.25);
            color: var(--parchment);
            font-family: 'Crimson Pro', serif;
            font-size: 14px;
            padding: 8px 10px;
            border-radius: 5px;
            outline: none;
            transition: all 0.3s;
            width: 130px;
        }

        .date-input:focus {
            border-color: rgba(201, 168, 76, 0.6);
            box-shadow: 0 0 12px rgba(201, 168, 76, 0.1);
        }

        .date-input::-webkit-calendar-picker-indicator {
            filter: invert(0.6) sepia(1) hue-rotate(5deg) saturate(2);
            cursor: pointer;
        }

        /* Ornament divider */
        .ornament {
            color: rgba(201, 168, 76, 0.4);
            letter-spacing: 4px;
            font-size: 10px;
        }

        .app-container {
            max-width: 420px;
            margin: 0 auto;
            padding: 16px 12px 60px;
        }
    </style>
</head>

<body>

    <!-- Mandala SVG background -->
    <svg class="mandala-bg" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="250" cy="250" r="240" stroke="#C9A84C" stroke-width="0.5" />
        <circle cx="250" cy="250" r="200" stroke="#C9A84C" stroke-width="0.3" />
        <circle cx="250" cy="250" r="160" stroke="#C9A84C" stroke-width="0.5" />

        <!-- Petals -->
        <g transform="translate(250,250)">
            <g>
                <ellipse cx="0" cy="-180" rx="20" ry="40" stroke="#C9A84C" stroke-width="0.5" />

        <!-- Star lines -->
        <line x1="250" y1="10" x2="250" y2="490" stroke="#C9A84C" stroke-width="0.2" />
        <line x1="10" y1="250" x2="490" y2="250" stroke="#C9A84C" stroke-width="0.2" />
        <line x1="80" y1="80" x2="420" y2="420" stroke="#C9A84C" stroke-width="0.2" />
        <line x1="420" y1="80" x2="80" y2="420" stroke="#C9A84C" stroke-width="0.2" />

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const normalizeDate = (d) => {
            const date = new Date(d);
            date.setHours(0, 0, 0, 0);
            return date;
        };

        const formatFullDate = (date) => {
            if (!date) return "";
            const d = date.getDate().toString().padStart(2, '0');
            const m = (date.getMonth() + 1).toString().padStart(2, '0');
            const y = date.getFullYear();
            return `${d}/${m}/${y}`;
        };

        const VedicGridCalculator = () => {
            const [auth, setAuth] = useState({ is: false, user: '', pass: '' });
            const [dob, setDob] = useState('');
            const [userName, setUserName] = useState('');
            const [gridData, setGridData] = useState(null);
            const [viewDate, setViewDate] = useState(normalizeDate(new Date()));
            const [showPD, setShowPD] = useState(false);
            const [showDD, setShowDD] = useState(false);

            const USERS = [{ user: 'admin', pass: 'vedic123' }, { user: 'guru', pass: 'om108' }];
            const GRID_MAP = [3, 1, 9, 6, 7, 5, 2, 8, 4];
            const DAY_NAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            const DAY_SCORES = [1, 2, 9, 5, 3, 6, 8];
            const PD_DURATIONS = { 1: 8, 2: 16, 3: 24, 4: 32, 5: 41, 6: 49, 7: 57, 8: 65, 9: 73 };

            const LUCKY_DATA = {
                1: { colour: "Golden · Orange", direction: "East", symbol: "☀" },
                2: { colour: "Milky White · Cream", direction: "North-West", symbol: "☽" },
                3: { colour: "Yellow · Orange", direction: "North-East", symbol: "♃" },
                4: { colour: "Blue · Black", direction: "South-West", symbol: "♄" },
                5: { colour: "Green", direction: "North", symbol: "☿" },
                6: { colour: "White · Metallic", direction: "South-East", symbol: "♀" },
                7: { colour: "Sandalwood · Grey", direction: "South-West", symbol: "☊" },
                8: { colour: "Blue · Black", direction: "West", symbol: "♇" },
                9: { colour: "Red", direction: "South", symbol: "♂" }
            };

            const CHALDEAN_MAP = {
                A: 1, I: 1, J: 1, Q: 1, Y: 1,
                B: 2, K: 2, R: 2,
                C: 3, G: 3, L: 3, S: 3,
                D: 4, M: 4, T: 4,
                E: 5, H: 5, N: 5, X: 5,
                U: 6, V: 6, W: 6,
                O: 7, Z: 7,
                F: 8, P: 8
            };

            const reduce = (n) => {
                while (n > 9) n = n.toString().split('').reduce((a, b) => a + +b, 0);
                return n;
            };

            const calculateNameTotal = (name) => {
                if (!name) return "";
                const sum = name.toUpperCase().split('').reduce((acc, char) => acc + (CHALDEAN_MAP[char] || 0), 0);
                return reduce(sum);
            };

            const calculate = (e) => {
                if (e) e.preventDefault();
                const d = new Date(dob);
                const day = d.getDate(), month = d.getMonth() + 1, year = d.getFullYear();
                const basic = reduce(day);
                const destiny = reduce(`${day}${month}${year}`.split('').reduce((a, b) => a + +b, 0));

                let gridSource = `${month}${year.toString().slice(-2)}${destiny}`;
                if (day === 10) gridSource += "1";
                else if (day === 20) gridSource += "2";
                else if (day === 30) gridSource += "3";
                else gridSource += day.toString() + (day > 9 ? basic.toString() : "");

                const counts = {};
                GRID_MAP.forEach(n => counts[n] = 0);
                gridSource.split('').forEach(n => { if (counts[n] !== undefined && n !== "0") counts[n]++; });

                const dashas = [], sequence = [];
                let currNum = basic, currStart = normalizeDate(d), totalYears = 0;

                while (totalYears < 100) {
                    let mdYears = currNum;
                    let mdEnd = new Date(currStart);
                    mdEnd.setFullYear(mdEnd.getFullYear() + mdYears);
                    mdEnd.setDate(mdEnd.getDate() - 1);
                    dashas.push({ number: currNum, start: new Date(currStart), end: normalizeDate(mdEnd) });

                    let adStart = new Date(currStart);
                    for (let j = 0; j < mdYears; j++) {
                        if (totalYears + j >= 100) break;
                        let adYearDate = new Date(adStart);
                        let adEnd = new Date(adYearDate);
                        adEnd.setFullYear(adEnd.getFullYear() + 1);
                        adEnd.setDate(adEnd.getDate() - 1);
                        sequence.push({
                            mdNumber: currNum,
                            number: reduce(basic + month + +adYearDate.getFullYear().toString().slice(-2) + DAY_SCORES[adYearDate.getDay()]),
                            start: normalizeDate(adYearDate),
                            end: normalizeDate(adEnd),
                            age: adYearDate.getFullYear() - year,
                            year: adYearDate.getFullYear()
                        });
                        adStart.setFullYear(adStart.getFullYear() + 1);
                    }
                    totalYears += mdYears;
                    currStart = new Date(mdEnd);
                    currStart.setDate(currStart.getDate() + 1);
                    currNum = currNum === 9 ? 1 : currNum + 1;
                }
                setGridData({ basic, destiny, counts, dashas, sequence });
                setViewDate(normalizeDate(new Date()));
                setShowPD(false);
                setShowDD(false);
            };

            const activeMD = useMemo(() => gridData?.dashas.find(d => viewDate >= d.start && viewDate <= d.end), [gridData, viewDate]);
            const activeAD = useMemo(() => gridData?.sequence.find(s => viewDate >= s.start && viewDate <= s.end), [gridData, viewDate]);

            const currentMDSequence = useMemo(() => {
                if (!gridData || !activeMD) return [];
                return gridData.sequence.filter(s => s.start >= activeMD.start && s.start <= activeMD.end);
            }, [gridData, activeMD]);

            const mdAgeRange = useMemo(() => {
                if (currentMDSequence.length === 0) return "";
                return `${currentMDSequence[0].age}–${currentMDSequence[currentMDSequence.length - 1].age}`;
            }, [currentMDSequence]);

            const pdSequence = useMemo(() => {
                if (!activeAD) return [];
                let seq = [], s = new Date(activeAD.start), n = activeAD.number;
                for (let i = 0; i < 9; i++) {
                    let e = new Date(s); e.setDate(e.getDate() + PD_DURATIONS[n]);
                    let de = new Date(e); de.setDate(de.getDate() - 1);
                    seq.push({ number: n, start: normalizeDate(s), end: normalizeDate(de) });
                    s = new Date(e); n = n === 9 ? 1 : n + 1;
                }
                return seq;
            }, [activeAD]);

            const activePD = pdSequence.find(p => viewDate >= p.start && viewDate <= p.end);
            const activeDD = activePD ? reduce(activePD.number + DAY_SCORES[viewDate.getDay()]) : null;

            const ddForecast = useMemo(() => {
                let list = [];
                for (let i = 0; i < 7; i++) {
                    let d = new Date(viewDate); d.setDate(viewDate.getDate() + i);
                    const pdAtDate = pdSequence.find(p => d >= p.start && d <= p.end);
                    if (pdAtDate) list.push({ date: d, ddNum: reduce(pdAtDate.number + DAY_SCORES[d.getDay()]), dayName: DAY_NAMES[d.getDay()] });
                }
                return list;
            }, [viewDate, pdSequence]);

            const handleLogin = (e) => {
                e.preventDefault();
                const valid = USERS.find(u => u.user === auth.user && u.pass === auth.pass);
                if (valid) setAuth({ ...auth, is: true }); else alert("Invalid credentials");
            };

            useEffect(() => {
                if (!showPD) {
                    const el = document.querySelector('[data-active="true"]');
                    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, [viewDate, showPD]);

            // ——— LOGIN PAGE ———
            if (!auth.is) return (
                <div style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '24px' }}>
                    <div className="login-card fade-in-up" style={{ width: '100%', maxWidth: '360px', borderRadius: '16px', padding: '48px 40px' }}>
                        {/* Ornamental top */}
                        <div style={{ textAlign: 'center', marginBottom: '32px' }}>
                            <div className="ornament" style={{ marginBottom: '12px', fontSize: '18px', letterSpacing: '8px' }}>✦ ✦ ✦</div>
                            <h1 className="cinzel" style={{ fontSize: '22px', fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.15em', textTransform: 'uppercase', marginBottom: '6px' }}>Vedic Grid</h1>
                            <p className="crimson" style={{ color: 'rgba(201,168,76,0.5)', fontSize: '14px', fontStyle: 'italic', letterSpacing: '0.05em' }}>Sacred Numerology System</p>
                            <div className="ornament" style={{ marginTop: '12px' }}>— ॐ —</div>
                        </div>

                        <form onSubmit={handleLogin} style={{ display: 'flex', flexDirection: 'column', gap: '14px' }}>
                            <input
                                className="gold-input"
                                type="text"
                                placeholder="Username"
                                style={{ padding: '12px 16px', borderRadius: '6px', width: '100%' }}
                                onChange={e => setAuth({ ...auth, user: e.target.value })}
                                required
                            />
                            <input
                                className="gold-input"
                                type="password"
                                placeholder="Password"
                                style={{ padding: '12px 16px', borderRadius: '6px', width: '100%' }}
                                onChange={e => setAuth({ ...auth, pass: e.target.value })}
                                required
                            />
                            <button type="submit" className="btn-primary" style={{ padding: '13px 24px', borderRadius: '6px', marginTop: '8px' }}>
                                Enter the Portal
                            </button>
                        </form>

                        <div style={{ textAlign: 'center', marginTop: '24px' }}>
                            <div className="ornament">✦ ✦ ✦</div>
                        </div>
                    </div>
                </div>
            );

            // ——— MAIN APP ———
            const lucky = gridData ? LUCKY_DATA[gridData.destiny] : null;

            return (
                <div className="app-container">
                    {/* Header */}
                    <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px', paddingBottom: '14px', borderBottom: '1px solid rgba(201,168,76,0.2)' }}>
                        <div>
                            <h1 className="cinzel" style={{ fontSize: '18px', fontWeight: 900, color: 'var(--gold)', letterSpacing: '0.1em' }}>VEDIC GRID</h1>
                            <p className="crimson" style={{ color: 'rgba(201,168,76,0.4)', fontSize: '11px', fontStyle: 'italic', letterSpacing: '0.05em' }}>Sacred Numerology</p>
                        </div>
                        <button onClick={() => setAuth({ is: false, user: '', pass: '' })}
                            style={{ fontFamily: 'Cinzel, serif', fontSize: '8px', letterSpacing: '0.15em', textTransform: 'uppercase', color: 'rgba(201,168,76,0.4)', background: 'none', border: '1px solid rgba(201,168,76,0.2)', padding: '5px 10px', borderRadius: '4px', cursor: 'pointer', transition: 'all 0.2s' }}
                            onMouseOver={e => { e.target.style.color = 'var(--gold)'; e.target.style.borderColor = 'rgba(201,168,76,0.5)'; }}
                            onMouseOut={e => { e.target.style.color = 'rgba(201,168,76,0.4)'; e.target.style.borderColor = 'rgba(201,168,76,0.2)'; }}
                        >
                            Logout
                        </button>
                    </header>

                    {/* Input Form */}
                    <form onSubmit={calculate} style={{ background: 'rgba(26,20,16,0.9)', border: '1px solid rgba(201,168,76,0.2)', borderRadius: '8px', padding: '12px', display: 'flex', gap: '8px', alignItems: 'center', marginBottom: '16px' }}>
                        <input type="date" value={dob} onChange={e => setDob(e.target.value)} className="date-input" required />
                        <div style={{ flex: 1, display: 'flex', alignItems: 'center', background: 'rgba(255,255,255,0.03)', border: '1px solid rgba(201,168,76,0.2)', borderRadius: '5px', padding: '0 10px', gap: '6px' }}>
                            <input
                                type="text"
                                placeholder="Name (optional)"
                                value={userName}
                                onChange={e => setUserName(e.target.value)}
                                className="gold-input"
                                style={{ border: 'none', background: 'none', padding: '8px 0', flex: 1, fontSize: '13px' }}
                            />
                            {userName && (
                                <span className="cinzel" style={{ fontSize: '14px', fontWeight: 700, color: 'var(--gold)', minWidth: '16px', textAlign: 'center' }}>
                                    {calculateNameTotal(userName)}
                                </span>
                            )}
                        </div>
                        <button type="submit" className="btn-primary" style={{ padding: '9px 16px', borderRadius: '5px', whiteSpace: 'nowrap', flexShrink: 0 }}>
                            Cast Grid
                        </button>
                    </form>

                    {gridData && (
                        <div className="fade-in-up" style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>

                            {/* Lucky strip */}
                            {lucky && (
                                <div className="lucky-strip" style={{ padding: '8px 16px', display: 'flex', justifyContent: 'center', gap: '32px' }}>
                                    <span className="crimson" style={{ color: 'rgba(201,168,76,0.7)', fontSize: '12px', fontStyle: 'italic' }}>
                                        <span style={{ color: 'rgba(201,168,76,0.4)', fontStyle: 'normal' }} className="cinzel" style2={{ fontSize: '8px' }}>Colour · </span>
                                        {lucky.colour}
                                    </span>
                                    <span style={{ color: 'rgba(201,168,76,0.3)' }}>✦</span>
                                    <span className="crimson" style={{ color: 'rgba(201,168,76,0.7)', fontSize: '12px', fontStyle: 'italic' }}>
                                        {lucky.direction}
                                    </span>
                                </div>
                            )}

                            {/* Grid + Nav */}
                            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '16px' }}>
                                {/* Left nav */}
                                <button className="nav-btn" onClick={() => {
                                    const idx = gridData.dashas.findIndex(d => viewDate >= d.start && viewDate <= d.end);
                                    if (idx > 0) setViewDate(gridData.dashas[idx - 1].start);
                                }}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="m15 18-6-6 6-6" />
                                    </svg>
                                </button>

                                {/* 3x3 Grid */}
                                <div className="vedic-grid-container grid-reveal" style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '2px', padding: '8px', borderRadius: '10px', width: '220px', height: '220px' }}>
                                    {GRID_MAP.map(num => {
                                        const displayStr = Array(gridData.counts[num]).fill(num).join('');
                                        const isMD = activeMD?.number === num;
                                        const isAD = activeAD?.number === num;
                                        const isPD = showPD && activePD?.number === num;
                                        const isDD = showPD && showDD && activeDD === num;
                                        const isDestiny = gridData.destiny === num;

                                        return (
                                            <div key={num} className="grid-cell">
                                                <span className="grid-cell-num">{num}</span>
                                                <div className="cell-content">
                                                    {displayStr && (
                                                        <span className={isDestiny ? 'destiny-color' : 'base-color'} style={{ fontSize: displayStr.length > 2 ? '11px' : '15px' }}>
                                                            {displayStr}
                                                        </span>
                                                    )}
                                                    {isMD && <span className="md-color" style={{ fontSize: '15px' }}>{num}</span>}
                                                    {isAD && <span className="ad-color" style={{ fontSize: '15px' }}>{num}</span>}
                                                    {isPD && <span className="pd-color" style={{ fontSize: '15px' }}>{num}</span>}
                                                    {isDD && <span className="dd-color" style={{ fontSize: '15px' }}>{num}</span>}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                {/* Right nav */}
                                <button className="nav-btn" onClick={() => {
                                    const idx = gridData.dashas.findIndex(d => viewDate >= d.start && viewDate <= d.end);
                                    if (idx < gridData.dashas.length - 1) setViewDate(gridData.dashas[idx + 1].start);
                                }}>
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                                        <path d="m9 18 6-6-6-6" />
                                    </svg>
                                </button>
                            </div>

                            {/* Color legend */}
                            <div style={{ display: 'flex', justifyContent: 'center', gap: '12px', flexWrap: 'wrap' }}>
                                {[
                                    { label: 'Destiny', color: '#B855E8' },
                                    { label: 'MD', color: '#E85555' },
                                    { label: 'AD', color: '#55C98A' },
                                    ...(showPD ? [{ label: 'PD', color: '#5594E8' }] : []),
                                    ...(showPD && showDD ? [{ label: 'DD', color: '#E8A855' }] : []),
                                ].map(item => (
                                    <div key={item.label} style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                                        <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: item.color, display: 'block', flexShrink: 0 }}></span>
                                        <span className="cinzel" style={{ fontSize: '8px', color: 'rgba(255,255,255,0.35)', letterSpacing: '0.1em' }}>{item.label}</span>
                                    </div>
                                ))}
                            </div>

                            {/* Info Panel */}
                            <div className="info-panel" style={{ borderRadius: '8px', padding: '10px 6px', display: 'flex', flexWrap: 'wrap', justifyContent: 'space-around', gap: '4px' }}>
                                <div className="info-chip">
                                    <span className="info-label">Basic</span>
                                    <span className="info-value" style={{ color: 'var(--gold)' }}>{gridData.basic}</span>
                                </div>
                                <div className="info-chip">
                                    <span className="info-label">Destiny</span>
                                    <span className="info-value destiny-color">{gridData.destiny}</span>
                                </div>
                                <div style={{ width: '1px', background: 'rgba(201,168,76,0.15)', margin: '4px 0' }}></div>
                                <div className="info-chip">
                                    <span className="info-label">MD</span>
                                    <span className="info-value md-color">{activeMD?.number || '–'}</span>
                                </div>
                                <div className="info-chip">
                                    <span className="info-label">AD</span>
                                    <span className="info-value ad-color">{activeAD?.number || '–'}</span>
                                </div>
                                {showPD && (
                                    <div className="info-chip">
                                        <span className="info-label">PD</span>
                                        <span className="info-value pd-color">{activePD?.number || '–'}</span>
                                    </div>
                                )}
                                {showPD && showDD && (
                                    <div className="info-chip">
                                        <span className="info-label">DD</span>
                                        <span className="info-value dd-color">{activeDD || '–'}</span>
                                    </div>
                                )}
                            </div>

                            {/* AD List */}
                            {!showPD && (
                                <div className="section-card fade-in-up">
                                    <div className="ad-list-header" style={{ padding: '10px 14px' }}>
                                        <div className="cinzel" style={{ fontSize: '8px', letterSpacing: '0.2em', textTransform: 'uppercase', color: 'rgba(85,201,138,0.7)', marginBottom: '3px' }}>
                                            Annual Dasha · MD {activeMD?.number}
                                        </div>
                                        <div className="crimson" style={{ color: 'rgba(255,255,255,0.5)', fontSize: '12px' }}>
                                            {formatFullDate(activeMD?.start)} — {formatFullDate(activeMD?.end)}
                                            <span style={{ color: 'rgba(201,168,76,0.4)', marginLeft: '8px' }}>Age {mdAgeRange} yrs</span>
                                        </div>
                                    </div>
                                    <div style={{ maxHeight: '240px', overflowY: 'auto' }}>
                                        {currentMDSequence.map((item, i) => {
                                            const isActive = activeAD === item;
                                            return (
                                                <div key={i} data-active={isActive} onClick={() => setViewDate(item.start)}
                                                    className={`ad-row ${isActive ? 'active' : ''}`}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                                        <div className="ad-badge" style={{
                                                            background: isActive ? 'linear-gradient(135deg, #34a067, #55C98A)' : 'rgba(255,255,255,0.06)',
                                                            color: isActive ? '#fff' : 'rgba(85,201,138,0.7)',
                                                            border: isActive ? 'none' : '1px solid rgba(85,201,138,0.2)'
                                                        }}>
                                                            {item.number}
                                                        </div>
                                                        <span className="crimson" style={{ fontSize: '13px', color: isActive ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.5)' }}>
                                                            {formatFullDate(item.start)} — {formatFullDate(item.end)}
                                                        </span>
                                                    </div>
                                                    <span className="cinzel" style={{ fontSize: '10px', color: 'rgba(201,168,76,0.4)', fontWeight: 600 }}>
                                                        {item.age.toString().padStart(2, '0')} yrs
                                                    </span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* PD Toggle */}
                            <button onClick={() => { setShowPD(!showPD); setShowDD(false); }}
                                className={`toggle-btn ${showPD ? 'toggle-btn-close' : 'toggle-btn-pd'}`}>
                                {showPD ? '← Return to Annual Dasha (AD)' : 'Open Pratyantar Dasha (PD) →'}
                            </button>

                            {/* PD Section */}
                            {showPD && (
                                <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }} className="fade-in-up">
                                    <div className="section-card">
                                        <div className="section-header" style={{ background: 'rgba(85,148,232,0.08)', color: 'rgba(85,148,232,0.8)', borderBottom: '1px solid rgba(85,148,232,0.15)' }}>
                                            Pratyantar Dasha Sequence · AD {activeAD?.number}
                                        </div>
                                        <div style={{ maxHeight: '200px', overflowY: 'auto' }}>
                                            {pdSequence.map((pd, i) => {
                                                const isActive = activePD === pd;
                                                return (
                                                    <div key={i} data-active={isActive} onClick={() => setViewDate(pd.start)}
                                                        className={`pd-row ${isActive ? 'active' : ''}`}
                                                        style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                                                        <div style={{
                                                            width: '26px', height: '26px', borderRadius: '4px', display: 'flex', alignItems: 'center', justifyContent: 'center',
                                                            fontFamily: 'Cinzel, serif', fontSize: '12px', fontWeight: 700,
                                                            background: isActive ? 'linear-gradient(135deg, #3a70cc, #5594E8)' : 'rgba(255,255,255,0.05)',
                                                            color: isActive ? '#fff' : 'rgba(85,148,232,0.7)',
                                                            border: isActive ? 'none' : '1px solid rgba(85,148,232,0.2)',
                                                            flexShrink: 0
                                                        }}>
                                                            {pd.number}
                                                        </div>
                                                        <span className="crimson" style={{ fontSize: '13px', color: isActive ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.5)' }}>
                                                            {formatFullDate(pd.start)} — {formatFullDate(pd.end)}
                                                        </span>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>

                                    {!showDD ? (
                                        <button onClick={() => setShowDD(true)} className="toggle-btn toggle-btn-dd">
                                            Show Daily Dasha (DD) Forecast →
                                        </button>
                                    ) : (
                                        <div className="section-card fade-in-up" style={{ border: '1px solid rgba(232,168,85,0.25)' }}>
                                            <div className="section-header" style={{ background: 'rgba(232,168,85,0.07)', color: 'rgba(232,168,85,0.8)', borderBottom: '1px solid rgba(232,168,85,0.15)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                                <span>Daily Dasha · 7-Day Forecast</span>
                                                <button onClick={() => setShowDD(false)} style={{ fontFamily: 'Cinzel, serif', fontSize: '7px', letterSpacing: '0.1em', textTransform: 'uppercase', color: 'rgba(232,168,85,0.5)', background: 'rgba(232,168,85,0.1)', border: '1px solid rgba(232,168,85,0.2)', padding: '3px 7px', borderRadius: '3px', cursor: 'pointer' }}>
                                                    Hide
                                                </button>
                                            </div>
                                            <div>
                                                {ddForecast.map((dd, i) => {
                                                    const isToday = dd.date.toDateString() === viewDate.toDateString();
                                                    return (
                                                        <div key={i} onClick={() => setViewDate(normalizeDate(dd.date))}
                                                            className="dd-row" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: isToday ? 'rgba(232,168,85,0.1)' : '' }}>
                                                            <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
                                                                <span className="cinzel" style={{ fontSize: '11px', fontWeight: 600, color: isToday ? 'var(--gold)' : 'rgba(255,255,255,0.3)', width: '28px' }}>
                                                                    {dd.dayName}
                                                                </span>
                                                                <span className="crimson" style={{ fontSize: '13px', color: isToday ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.45)' }}>
                                                                    {formatFullDate(dd.date)}
                                                                </span>
                                                            </div>
                                                            <div className="dd-badge">{dd.ddNum}</div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Footer ornament */}
                            <div style={{ textAlign: 'center', paddingTop: '8px' }}>
                                <span className="ornament" style={{ fontSize: '12px' }}>✦ ॐ ✦</span>
                            </div>

                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<VedicGridCalculator />);
    </script>
</body>

</html>
